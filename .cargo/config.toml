[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
# ESP-IDF 5 and later use 64-bit time_t.
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU="esp32"
ESP_IDF_VERSION = "tag:v6.1.1"
# Keep esp-idf-sys metadata and sdkconfig discovery rooted here with a custom target directory.
CARGO_WORKSPACE_DIR = { value = ".", relative = true }
