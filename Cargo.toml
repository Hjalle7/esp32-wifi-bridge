[package]
name = "esp32-wifi-bridge"
version = "0.1.0"
authors = ["Owen Walpole <owen@walpole.dev>"]
edition = "2021"
description = "Wi-Fi to Ethernet bridge targeting the ESP32."
homepage = "https://github.com/owenthewizard/esp32-wifi-bridge"
repository = "https://github.com/owenthewizard/esp32-wifi-bridge"
license = "GPL-3.0-or-later"
keywords = ["esp32", "embedded", "binary"]
categories = ["embedded"]
resolver = "2"

[[bin]]
name = "esp32-wifi-bridge"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1

[profile.dev]
# Symbols are nice and they don't increase the size on Flash
debug = true
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native"]

std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]

[dependencies]
log = { version = "0.4", default-features = false, features = ["release_max_level_warn"] }
# min binary size
#log = { version = "0.4", default-features = false, features = ["max_level_off"] }
esp-idf-svc = "0.53.0"
once_cell = "1"

[build-dependencies]
embuild = "0.33.7"

# ESP-IDF 6 moved the board's PHY driver into a separate component.
# This commit is the upstream lan87xx@v1.1.0 release.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/lan87xx", git = "https://github.com/espressif/esp-eth-drivers.git", path = "lan87xx", version = "b30d137564452f5a8cfa02d5855df1a69a3d82cf" }
