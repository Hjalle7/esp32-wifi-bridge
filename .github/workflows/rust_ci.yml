name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  callback-tests:
    name: Callback Lifecycle Tests (host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup host Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test callback admission, teardown and TX counters
        run: |
          rustc +stable --edition=2021 --test tests/host/callback_gate.rs -o /tmp/bridge-callback-tests
          /tmp/bridge-callback-tests
          rustc +stable --edition=2021 --test tests/host/ethernet_rx.rs -o /tmp/bridge-ethernet-tests
          /tmp/bridge-ethernet-tests
          rustc +stable --edition=2021 --test tests/host/tx_diagnostics.rs -o /tmp/bridge-tx-tests
          /tmp/bridge-tx-tests

  rust-checks:
    name: Rust Checks
    # ESP-IDF v5.3.3's esp-clang requires the libxml2.so.2 ABI.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release --locked
          - command: fmt
            args: --all -- --check --color always
          - command: clippy
            args: --locked --all-targets --all-features --workspace -- -D warnings
    env:
      WIFI_SSID: My Awesome Network
      WIFI_PASS: hunter2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxml2
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
